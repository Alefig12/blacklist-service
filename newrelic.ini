# Configuración del agente APM de New Relic que no se puede definir con variables de entorno.
# La licencia (NEW_RELIC_LICENSE_KEY) y el nombre de la app (NEW_RELIC_APP_NAME) no van aquí:
# llegan por variables de entorno desde docker-compose o desde la tarea de ECS.
[newrelic]
# Los 401 por token ausente o inválido son errores del cliente, no fallas del servicio:
# se marcan como esperados para que sigan en Errors Inbox pero no cuenten en la tasa de
# errores, el Apdex ni las alertas.
error_collector.expected_classes = flask_jwt_extended.exceptions.NoAuthorizationError
    jwt.exceptions.DecodeError
    jwt.exceptions.InvalidSignatureError
    jwt.exceptions.ExpiredSignatureError
